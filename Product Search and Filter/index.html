<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Search & Filter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Product Store</h1>
      <p>Search and filter your favorite products</p>
    </header>

    <main class="container">
      <section class="filter-section">
        <div class="search-box">
          <label for="search">Search Product</label>
          <input type="text" id="search" placeholder="Search products..." />
        </div>

        <div class="filter-group">
          <div>
            <label for="category">Category</label>
            <select id="category">
              <option value="all">All Category</option>
              <option value="electronics">Electronics</option>
              <option value="clothing">Clothing</option>
              <option value="shoes">Shoes</option>
              <option value="accessories">Accessories</option>
            </select>
          </div>
          <div>
            <label for="price">Maximum Price</label>
            <select id="price">
              <option value="all">Any Price</option>
              <option value="50">Under $50</option>
              <option value="100">Under $100</option>
              <option value="200">Under $200</option>
              <option value="500">Under $500</option>
              <option value="50">Under $50</option>
            </select>
          </div>

          <div>
            <label for="rating">Minimum Rating</label>
            <select id="rating">
              <option value="0">Any Rating</option>
              <option value="4">4+ ⭐</option>
              <option value="3">3+ ⭐</option>
              <option value="2">2+ ⭐</option>
            </select>
          </div>

          <div>
            <label for="sort">Sort By</label>
            <select id="sort">
              <option value="default">Default</option>
              <option value="name-asc">Name: A-Z</option>
              <option value="name-desc">Name: Z-A</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="rating-high">Rating: High to Low</option>
            </select>
          </div>
        </div>
        <button id="clear-btn">Clear Filters</button>
      </section>

      <div class="result-info">
        <p>Showing <strong id="product-count">0</strong> products</p>
      </div>

      <section id="product-container" class="product-container">
        <!-- Products will be generated by JavaScript -->
      </section>

      <div id="no-result" class="no-result">
        <h2>No products found</h2>
        <p>Try changing your search or filters.</p>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
