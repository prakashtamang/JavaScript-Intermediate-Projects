<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toast Notification</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Toast Notification</h2>
      <div class="toast-buttons">
        <button class="toast-btn success-btn">Success</button>
        <button class="toast-btn error-btn">Error</button>
        <button class="toast-btn info-btn">Information</button>
        <button class="toast-btn warning-btn">Warning</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
