<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Expense Tracker</h1>
        <p>Track your income and expenses</p>
      </header>

      <!-- Summary -->
      <section class="summary">
        <div class="summary-card">
          <h3>Total Balance</h3>
          <p id="balance">Rs. 0.00</p>
        </div>

        <div class="summary-card income-card">
          <h3>income</h3>
          <p id="income">Rs. 0.00</p>
        </div>

        <div class="summary-card expense-card">
          <h3>Expenses</h3>
          <p id="expense">Rs. 0.00</p>
        </div>
      </section>

      <!-- Add Transaction -->
      <section class="transaction-form">
        <h2>Add Transaction</h2>
        <div class="type-buttons">
          <button type="button" id="incomeBtn" class="type-btn active">
            Income
          </button>
          <button type="button" id="expenseBtn" class="type-btn">
            Expense
          </button>
        </div>

        <form id="transactionForm">
          <div class="form-group">
            <label for="name">Transaction Name</label>
            <input
              type="text"
              id="name"
              placeholder="e.g. Salary, Food, Rent"
              required
            />
          </div>
          <div class="form-group">
            <label for="amount">Amount</label>
            <input
              type="number"
              id="amount"
              placeholder="Enter amount"
              min="0"
              step="0.01"
              required
            />
          </div>

          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>

          <button type="submit" class="submit-btn">Add Transaction</button>
        </form>
      </section>

      <!-- Transactions -->
      <section class="transactions">
        <div class="transactions-header">
          <h2>Transactions</h2>
          <span id="transactionCount">0 Transactions</span>
        </div>

        <div id="transactionList" class="transaction-list">
          <p class="empty-message">No transactions yet</p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
